<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>russia-ex – interactive footprint map of Russian regions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="app-header">
        <div class="app-header__brand">
          <h1 class="app-title" data-i18n-key="app.title">russia-ex</h1>
          <p class="app-subtitle" data-i18n-key="app.subtitle"></p>
        </div>

        <div class="app-header__actions">
          <a
            class="chrome-link"
            href="https://github.com/nZiben/russia-ex"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>

          <div class="language-switcher" aria-label="Language selector">
            <span class="language-switcher__label" data-i18n-key="controls.languageLabel"></span>
            <button type="button" class="language-switcher__button is-active" data-locale="en">
              EN
            </button>
            <button type="button" class="language-switcher__button" data-locale="ru">RU</button>
          </div>
        </div>
      </header>

      <main class="app-main">
        <section class="map-stage">
          <div
            id="map-root"
            class="map-grid-container"
            aria-label="Map of Russian regions"
            role="grid"
          ></div>
        </section>

        <aside class="legend">
          <h2 class="sr-only" data-i18n-key="legend.title"></h2>
          <ul id="legend-levels" class="legend__list"></ul>
        </aside>

        <section class="score" aria-live="polite">
          <p class="score__label" data-i18n-key="score.totalLabel"></p>
          <p class="score__numbers">
            <span id="score-current">0</span>
            <span class="score__slash">/</span>
            <span id="score-max">0</span>
          </p>
          <p id="score-visited" class="score__meta"></p>
        </section>

        <section class="controls">
          <button
            type="button"
            id="reset-all"
            class="button button--secondary"
            data-i18n-key="controls.resetAll"
          ></button>
          <button
            type="button"
            id="save-image"
            class="button button--primary"
            data-i18n-key="controls.saveImage"
          ></button>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
